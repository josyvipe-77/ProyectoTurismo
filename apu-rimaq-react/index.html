<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FAF2EC" />
    <meta
      name="description"
      content="Apu Rimaq: un cuaderno de viaje para explorar la cultura y naturaleza de Apurímac. Descubre rutas y construye tu itinerario."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apu Rimaq · Apurímac no se visita, se escucha</title>
    <style>
      html {
        background: #252525;
      }
      body {
        margin: 0;
      }
      html[data-home-boot] {
        background: #252525;
      }
      #boot-scene {
        display: none;
      }
      html[data-home-boot] #boot-scene {
        display: grid;
        place-items: center;
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        background: #252525;
        opacity: 1;
        transition: opacity 1600ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .boot-inner {
        display: grid;
        justify-items: center;
        gap: 22px;
        padding: 24px;
        opacity: 1;
        transform: translateY(0);
        transition:
          opacity 650ms ease,
          transform 850ms ease;
      }
      .boot-emblem {
        display: block;
        width: 112px;
        height: 66px;
        overflow: visible;
        fill: none;
        stroke: #f7f2e8;
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .boot-emblem .boot-ridge-far {
        opacity: 0.3;
      }
      .boot-emblem .boot-ridge-near {
        opacity: 0.85;
      }
      .boot-emblem .boot-sun {
        stroke: #bea66c;
        animation: boot-sun-breathe 2.8s ease-in-out infinite alternate;
      }
      .boot-emblem .boot-mist {
        opacity: 0.45;
        animation: boot-mist-drift 3s ease-in-out infinite alternate;
      }
      .boot-emblem .boot-mist-back {
        opacity: 0.2;
        animation-delay: -1.5s;
      }
      .boot-brand {
        margin: 0;
        font:
          italic 400 38px / 1.1 Georgia,
          serif;
        letter-spacing: -0.06em;
        color: #f7f2e8;
      }
      .boot-brand-dot {
        color: #b65b4c;
        font-size: 24px;
        margin-left: 5px;
      }
      .boot-track {
        width: 72px;
        height: 1px;
        background: #f7f2e829;
        overflow: hidden;
      }
      .boot-track span {
        display: block;
        width: 22px;
        height: 100%;
        background: #f7f2e8b3;
        animation: boot-progress 1.5s ease-in-out infinite;
      }
      .boot-caption {
        font:
          400 9px / 1.4 system-ui,
          sans-serif;
        letter-spacing: 0.16em;
        color: #bbb6ae;
      }
      @keyframes boot-progress {
        from {
          transform: translateX(-22px);
        }
        to {
          transform: translateX(72px);
        }
      }
      @keyframes boot-mist-drift {
        from {
          transform: translateX(-4px);
        }
        to {
          transform: translateX(4px);
        }
      }
      @keyframes boot-sun-breathe {
        from {
          opacity: 0.45;
        }
        to {
          opacity: 0.95;
        }
      }
      html[data-home-boot='revealing'] #boot-scene {
        opacity: 0;
      }
      html[data-home-boot='revealing'] .boot-inner {
        opacity: 0;
        transform: translateY(-6px);
      }
      @media (prefers-reduced-motion: reduce) {
        html[data-home-boot] #boot-scene {
          transition: none;
        }
        .boot-inner {
          transition: none;
        }
        .boot-track span {
          animation: none;
          transform: translateX(25px);
        }
        .boot-emblem .boot-mist,
        .boot-emblem .boot-sun {
          animation: none;
        }
      }
    </style>
    <script>
      if (location.pathname === '/' && !location.hash) {
        document.documentElement.dataset.homeBoot = 'pending';
        for (const source of ['/images/hero-user-v2.png', '/images/cloud-wisp.webp']) {
          const preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'image';
          preload.href = source;
          document.head.append(preload);
        }
      }
    </script>
  </head>
  <body>
    <div id="boot-scene" role="status" aria-live="polite" aria-label="Cargando Apu Rimaq">
      <div class="boot-inner" aria-hidden="true">
        <svg class="boot-emblem" viewBox="0 0 144 84" focusable="false">
          <circle class="boot-sun" cx="87" cy="14" r="6" />
          <path class="boot-ridge-far" d="M10 55 35 28 48 43 64 20 82 45 103 30 135 58" />
          <path class="boot-ridge-near" d="M8 64 37 41 54 55 77 30 91 46 106 40 136 64" />
          <path class="boot-ridge-far" d="m64 20 6 12 5-2M77 30l6 13 8 3" />
          <path class="boot-mist" d="M23 67c14-5 24-5 39-1s28 5 50 0" />
          <path class="boot-mist boot-mist-back" d="M35 76c14-3 25-2 39 1s25 2 41-2" />
        </svg>
        <p class="boot-brand">Apu Rimaq<span class="boot-brand-dot">•</span></p>
        <div class="boot-track"><span></span></div>
        <span class="boot-caption">Abriendo el cuaderno</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
